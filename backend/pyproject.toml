[project]
name = "lifepilot-backend"
version = "0.1.0"
description = "LifePilot AI coaching backend"
requires-python = ">=3.11"

dependencies = [
    # --- Web framework ---
    "fastapi[standard]>=0.115.0",     # FastAPI with uvicorn bundled
    "uvicorn[standard]>=0.34.0",      # ASGI server with websocket support

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.0",     # SQLAlchemy 2.x with async support
    "asyncpg>=0.30.0",                # Async PostgreSQL driver
    "alembic>=1.14.0",                # Schema migrations

    # --- Auth & Security ---
    "python-jose[cryptography]>=3.3.0",  # JWT creation and verification
    "bcrypt>=4.0.0",                     # Password hashing — used directly (passlib is unmaintained and incompatible with bcrypt 4.x)
    "python-multipart>=0.0.20",          # Required for form data (OAuth flows)

    # --- Config ---
    "pydantic-settings>=2.7.0",       # Typed environment variable management
    "python-dotenv>=1.0.0",           # .env file loading

    # --- AI / LLM ---
    "langchain>=0.3.0",               # LLM chains, prompts, memory
    "langchain-community>=0.3.0",     # Community integrations
    "langchain-openai>=0.3.0",        # OpenAI-compatible client (used for NIM)
    "langgraph>=0.2.0",               # Graph-based agent orchestration
    "openai>=1.50.0",                 # OpenAI SDK — NIM uses the same API surface

    # --- Embeddings & Vector ---
    "pgvector>=0.3.0",                # pgvector SQLAlchemy integration
    "sentence-transformers>=3.0.0",   # Local embedding models (fallback)
    "numpy>=1.26.0",                  # Vector operations

    # --- HTTP Client ---
    "httpx>=0.27.0",                  # Async HTTP client (replaces raw fetch)
    "aiofiles>=24.1.0",               # Async file I/O

    # --- Document Processing ---
    "pypdf>=5.0.0",                   # PDF parsing (replaces pdf-parse/pdf2json)
    "tiktoken>=0.7.0",                # Token counting for context window management

    # --- Email ---
    "resend>=2.0.0",                  # Resend email API

    # --- Utilities ---
    "python-dateutil>=2.9.0",         # Date parsing and manipulation
    "uuid>=1.30",                     # UUID generation
]

[tool.uv]
# This is a FastAPI application, not a library.
# Setting package = false tells uv: "just install dependencies,
# don't try to build/install this project itself as an editable wheel."
package = false

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",                  # For TestClient
    "factory-boy>=3.3.0",             # Test data factories
    "ruff>=0.8.0",                    # Linting + formatting
    "mypy>=1.13.0",                   # Static type checking
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI uses function calls in default args (Depends)

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
